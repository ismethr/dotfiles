<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Render Chinese with Source Han Sans CN (sans) and Noto Serif/Mono CJK SC instead of
  the Korean one fontconfig falls back to. Latin fonts stay as Omarchy sets them
  (/etc/fonts/conf.d/50-omarchy.conf).
  Monospace stays owned by `omarchy font set` (fonts.conf); only the CJK
  fallback is added here.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Source Han Sans CN</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono CJK SC</family>
    </prefer>
  </alias>

  <!-- Chinese sites ask for Windows/macOS fonts by name; map them to Source Han Sans CN / Noto Serif CJK SC.
       Microsoft YaHei is installed in ~/.local/share/fonts and used as-is. -->
  <alias>
    <family>system-ui</family>
    <prefer><family>Source Han Sans CN</family></prefer>
  </alias>
  <alias><family>PingFang SC</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias><family>Hiragino Sans GB</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias><family>Source Han Sans SC</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias><family>思源黑体</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias><family>SimHei</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias><family>黑体</family><prefer><family>Source Han Sans CN</family></prefer></alias>
  <alias><family>SimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>Songti SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>Source Han Serif SC</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias><family>思源宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>

  <!-- Last-resort CJK fallback when an app names no family or no lang
       (Chromium/Electron per-glyph lookups). Charset beats family, so this
       only ever supplies glyphs other fonts lack. -->
  <match target="pattern">
    <edit name="family" mode="append_last"><string>Source Han Sans CN</string></edit>
  </match>

  <!-- Pages and documents tagged with another CJK language keep their glyphs. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ja</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK JP</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK KR</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend"><string>Noto Sans CJK HK</string></edit>
  </match>

  <!-- Crisper text on LCD panels. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
